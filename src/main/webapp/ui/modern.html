<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Bang! Modern UI (alpha)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 16px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 8px
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            text-align: left
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        input[type="text"] {
            padding: 6px 8px
        }

        button {
            padding: 6px 10px;
            border: 1px solid #888;
            border-radius: 6px;
            background: #f6f6f6;
            cursor: pointer
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }
    </style>
    <link rel="stylesheet" href="./app.css"/>
    <script type="module" src="./app.js"></script>
    <!-- Tipp: Link in alter index.html ergänzen, um diese Seite manuell aufzurufen -->
</head>
<body>
<h1>Bang! – Modern UI (alpha)</h1>
<div class="row">
    <label>Handle: <input id="handle" type="text" placeholder="Your name"/></label>
    <label>Game ID: <input id="gameId" type="text" placeholder="(optional)"/></label>
    <button id="btnCreate">Create Game</button>
    <button id="btnJoin">Join</button>
    <button id="btnLeave" disabled>Leave</button>
</div>
<div class="grid">
    <section>
        <h2>Lobby</h2>
        <div id="lobby"></div>
    </section>
    <section>
        <h2>Game <span id="turn" class="muted"></span></h2>
        <div id="meta" class="muted"></div>
        <div id="game"></div>
        <h3>Your Hand</h3>
        <div id="hand" class="cards"></div>
    </section>
    <section>
        <h2>Chat</h2>
        <div id="chatlog" class="chatlog"></div>
        <div class="row">
            <label for="chatInput">HIER REIN CHATTEN</label>
            <input id="chatInput" type="text" placeholder="message..."/>
            <button id="btnChat" disabled>Send</button>
        </div>
    </section>
</div>
<!-- Lightweight Modal -->
<div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-title">Server message</div>
        <div id="modalBody" class="modal-body"></div>
        <div class="row">
            <label for="responseInput">Antworte</label><input id="responseInput" type="text"
                                                              placeholder="type response..."/>
            <button id="btnSendResponse">Send</button>
            <button id="btnCloseModal" class="secondary">Close</button>
        </div>
    </div>
</div>
</body>
</html>
